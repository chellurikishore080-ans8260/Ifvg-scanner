name: IFVG Backtest

on:
  workflow_dispatch:
    inputs:
      coins:
        description: "Top coins by 24h volume"
        default: "100"
      entry_mode:
        description: "Confirmation Close or IFVG Line"
        default: "Confirmation Close"
      filter_mode:
        description: "Balanced / Loose / Strict / Off"
        default: "Balanced"
      fee_side_pct:
        description: "Fee per side in % (entry and exit each)"
        default: "0.01"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run backtest
        env:
          COINS: ${{ inputs.coins }}
          ENTRY: ${{ inputs.entry_mode }}
          FILTER: ${{ inputs.filter_mode }}
          FEE: ${{ inputs.fee_side_pct }}
        run: python run_backtest.py --coins "$COINS" --entry-mode "$ENTRY" --filter "$FILTER" --fee-side-pct "$FEE" --out results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ifvg-backtest-results
          path: results/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Update backtest results" || echo "No changes"
          git push
